<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="wudi-asset-version" content="1.3.0">
  <title>W.U.D.I. 投研决策</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060607'/%3E%3Crect x='2' y='2' width='28' height='28' fill='none' stroke='%23ffb000' stroke-width='1.5'/%3E%3Cpath d='M10 8v16M22 8v16M10 16h12' stroke='%23ffb000' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <script>
    /* 首屏定主题，避免 FOUC */
    (function () {
      try {
        /* app.js 经 lsSet 用 JSON.stringify 写入，localStorage 实际存 '"light"'/'"dark"'（含引号），
           此处必须同样 JSON.parse 解码，否则裸串两边都不等、恒走系统兜底 → 每次刷新主题闪烁。 */
        var raw = localStorage.getItem('hermes.theme');
        var t;
        try { t = JSON.parse(raw); } catch (e) { t = raw; }
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
  <link rel="stylesheet" href="vendor/phosphor/style.css?v=1.3.0">
  <link rel="stylesheet" href="css/app.css?v=1.3.0">
  <link rel="stylesheet" href="css/responsive.css?v=1.3.0">
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>
    <div class="main-wrap">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <footer id="statusbar" class="statusbar"></footer>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="vendor/echarts.min.js?v=1.3.0"></script>
  <script src="vendor/marked.min.js?v=1.3.0"></script>
  <!-- html2canvas/jsPDF 仅在用户点击导出时由 js/export.js 并发加载。 -->
  <script type="module" src="js/app.js?v=1.3.0"></script>
</body>
</html>
